[workspace]
authors = ["ONNX Contributors <onnx-technical-discuss@lists.lfaidata.foundation>"]
channels = ["conda-forge"]
description = "Open Neural Network Exchange"
name = "onnx"
platforms = ["osx-arm64", "linux-64", "win-64"]

[tasks.build-install]
description = "Build and install this project in an editable mode into the default environment."
cmd = 'export CMAKE_ARGS="$CMAKE_ARGS $CMAKE_EXTRA_ARGS" && pip install --no-deps --no-build-isolation -v -e . --force'
[tasks.build-install.env]
ONNX_ML="1"
ONNX_BUILD_TESTS="1"
CMAKE_EXTRA_ARGS="-DONNX_USE_PROTOBUF_SHARED_LIBS=ON"
# depends-on = ["build", "install"]

[feature.build.tasks.build]
description = "Build a wheel in a clean build environment"
cmd = 'export CMAKE_ARGS="$CMAKE_ARGS $CMAKE_EXTRA_ARGS" && pip wheel --no-deps -v --no-build-isolation -w dist'
[feature.build.tasks.build.env]
ONNX_ML="1"
ONNX_BUILD_TESTS="1"
CMAKE_EXTRA_ARGS="-DONNX_USE_PROTOBUF_SHARED_LIBS=ON"

[feature.run.tasks.install]
description = "Install wheel produced by the build task"
cmd = 'pip install --no-deps --force-reinstall --no-index --find-links dist onnx'

[feature.run.tasks.gen-operator-md]
description = "Generate markdown files with operator definitions"
cmd = "python onnx/defs/gen_doc.py"

[feature.run.tasks.gen-operator-coverage]
description = "Generate operator test coverage report"
cmd = "python onnx/backend/test/stat_coverage.py"

[feature.run.tasks.gen-proto]
description = "Generate proto files"
cmd = "python onnx/gen_proto.py -l && python onnx/gen_proto.py -l --ml"

[feature.run.tasks.gen-test-data-feature-branch]
description = "Generate test data based on what files changed in the current branch"
cmd = "python onnx/backend/test/cmd_tools.py generate-data --diff"

[feature.run.tasks.gen-all]
description = "Recreate auto-generated files."
depends-on = ["gen-operator-md", "gen-operator-coverage", "gen-proto", "gen-test-data-feature-branch"]

[feature.docs.tasks.docs-build]
description = "Build sphinx documentation"
cmd = "cd docs/docsgen && make html"

[feature.build.tasks.gtest]
description = "Run gtest suite (requires prior build)."
cmd = ".setuptools-cmake-build/onnx_gtests"
[target.win-64.tasks.gtest]
# Different path on Windows
cmd = ".setuptools-cmake-build/Release/onnx_gtests.exe"

[feature.run.tasks.pytest]
description = "Run Python test suite"
cmd = "pytest"

[feature.lint.tasks.add-license-header]
description = "Add license header to specified file"
args = [
  { "arg" = "FILE" }
]
cmd = "reuse annotate --copyright 'ONNX Project Contributors' --license Apache-2.0 --exclude-year --skip-existing {{ FILE }}"

[feature.build.tasks.clang-tidy]
description = "Run clang-tidy on the entire project"
# Requires `.setuptools-cmake-build/compile_commands.json` which is produce in the build task.
# The trailing grep call filters:
#  - [51/70][20.8s] /...bin/clang-tidy ... — starts with [
#  - 12101 warnings generated. — starts with digits
#  - Empty lines between blocks
cmd = 'run-clang-tidy -p .setuptools-cmake-build -use-color -quiet -source-filter="{{ pixi.init_cwd }}/onnx" | grep -vE "^\[|^[0-9]+ warnings generated\." --line-buffer'

[feature.host.dependencies]
c-compiler = ">=1.8.0"
cmake = ">=3.31.5"
cxx-compiler = ">=1.8.0"
ninja = "*"
make = "*"
setuptools = ">=75.8.0"
wheel = ">=0.45.1"

[feature.build.dependencies]
numpy = ">=1.22.0"
libdate = ">=3.0.1,<4"
nanobind = ">=2.8.0"
pip = ">=25.0"
libprotobuf = "*"

[feature.run.dependencies]
ml_dtypes = ">=0.5.1"
packaging = ">=24.1"
python = ">=3.10"
pillow = ">=12"
protobuf = "*"

[feature.test.dependencies]
parameterized = ">=0.9.0"
pytest = ">=8.3.4"
pytest-cov = ">=6.0.0"
pytest-xdist = ">=3.6.1"
"ruamel.yaml" = ">=0.19.1"

[feature.docs.dependencies]
furo = "*"
markupsafe = "*"
matplotlib = "*"
myst-parser = "*"
onnxruntime = "*"
pillow = "*"
pydot = "*"
sphinx = "*"
sphinx-copybutton = "*"
sphinx-gallery = "*"
sphinx-tabs = "*"
setuptools = "<82"  # sphinx-tabs needs pkg_resources which was removed in 82
linkify-it-py = "*"
[feature.docs.pypi-dependencies]
sphinx-exec-code = "*"

[feature.lint.dependencies]
# follows requirements-lintrunner.txt
ruff = "==0.15.2"
pre-commit = "*"
types-protobuf = "==6.30.2.20250516"
clang-tools = "*"
prek = ">=0.3.8"
typos = ">=1.44.0,<2"
shellcheck = ">=0.11.0"
prettier = ">=3.8.1,<4"
reuse = ">=5.1.1,<7"
lintrunner = ">=0.10.7"

[feature.lint.tasks]
lintrunner-init = "lintrunner init"
lintrunner-run = "lintrunner --all-files"

[feature.lint.pypi-dependencies]
lintrunner-adapters = ">=0.12.3"
editorconfig-checker = "==3.2.1"

[feature.py313.dependencies]
python-gil = "3.13.*"
[feature.py314.dependencies]
python-gil = "3.14.*"

[feature.oldies.dependencies]
python-gil = "3.10.*"
libprotobuf = "==4_25_1"
numpy = "==1.23.2"

[environments]
# Default environment is the super set of dependencies the user may want
# We use Python 3.13 for now since conda-forge does not have a 3.14
# onnxruntime, yet, which is used in the docs environment.
default = ["py313", "host", "build", "run", "test", "docs", "lint"]

# Clean and precise environment for CI and debugging
build-py314 = { features = ["py314", "host", "build"], solve-group="py314" }
run-py314 = { features=["py314", "build", "test", "run"], solve-group="py314" }

build-oldies = { features = ["oldies", "host", "build"], solve-group="oldies" }
run-oldies = { features=["oldies", "build", "test", "run"], solve-group="oldies" }

build-docs = { features = ["host", "build", ], solve-group="docs" }
run-docs = { features=["build", "test", "run", "docs"], solve-group="docs" }
